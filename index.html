<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AdaDeals — Mall Deals Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
<script defer src="https://cloud.umami.is/script.js" data-website-id="292a04af-3bf7-498e-870e-6b2f5a14ed57"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #11100E;
    --surface: rgba(255,255,255,.10);
    --surface-strong: rgba(255,255,255,.18);
    --surface-soft: rgba(255,255,255,.08);
    --border: rgba(255,255,255,.18);
    --text: #FFFFFF;
    --muted: rgba(255,255,255,.74);
    --soft: rgba(255,255,255,.52);
    --accent: #F97316;
    --accent2: #FBBF24;
    --dark: #15120F;
    --danger: #FF5A4F;
    --success: #7BE495;
    --radius: 24px;
    --bottom-nav: 72px;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font-family: inherit; }
  button { -webkit-tap-highlight-color: transparent; }

  .app-shell { height: 100dvh; position: relative; overflow: hidden; background: #0E0D0B; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    padding: calc(12px + env(safe-area-inset-top)) 14px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    pointer-events: none;
  }
  .brand-lockup, .top-actions { pointer-events: auto; }
  .brand-lockup {
    display: flex; align-items: center; gap: 10px;
    background: rgba(12,12,12,.34); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(14px); border-radius: 999px; padding: 8px 12px 8px 13px;
  }
  .logo { font-family: 'DM Serif Display', serif; font-size: 23px; letter-spacing: -.4px; line-height: 1; }
  .logo span { color: var(--accent2); }
  .city-chip { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; border-left: 1px solid rgba(255,255,255,.2); padding-left: 10px; }
  .top-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(12,12,12,.36); color: white; backdrop-filter: blur(14px);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { transform: scale(.96); }

  .feed {
    height: 100dvh; overflow-y: auto; scroll-snap-type: y mandatory; scroll-behavior: smooth;
    scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { width: 0; height: 0; }

  .deal-screen {
    height: 100dvh; width: 100%; position: relative; scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; align-items: stretch; justify-content: center; overflow: hidden;
    background: linear-gradient(145deg, #1B1815, #080807);
  }
  .deal-screen::before {
    content: ''; position: absolute; inset: 0; opacity: .92;
    background:
      radial-gradient(circle at 15% 18%, rgba(251,191,36,.34), transparent 30%),
      radial-gradient(circle at 82% 22%, rgba(249,115,22,.28), transparent 28%),
      radial-gradient(circle at 45% 82%, rgba(255,255,255,.12), transparent 28%),
      linear-gradient(165deg, var(--card-a), var(--card-b) 55%, #0D0C0A 115%);
  }
  .deal-screen::after {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.42), transparent 22%, transparent 50%, rgba(0,0,0,.74) 100%),
      linear-gradient(to right, rgba(0,0,0,.05), transparent 45%, rgba(0,0,0,.32));
  }

  .noise {
    position: absolute; inset: 0; opacity: .13; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  .content {
    position: relative; z-index: 2; width: min(100%, 520px); height: 100%; padding: 92px 18px calc(var(--bottom-nav) + 30px);
    display: flex; flex-direction: column; justify-content: flex-end;
  }

  .deal-meta-top { position: absolute; top: calc(78px + env(safe-area-inset-top)); left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .mall-pill, .urgency-pill, .featured-pill, .category-pill, .tiny-pill {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 7px 11px;
    border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.22); backdrop-filter: blur(12px);
    font-size: 12px; color: var(--muted); font-weight: 600;
  }
  .urgency-pill { color: white; background: rgba(255,90,79,.18); border-color: rgba(255,90,79,.35); }
  .urgency-pill.good { background: rgba(123,228,149,.15); border-color: rgba(123,228,149,.28); }
  .featured-pill { color: #FFE8B1; background: rgba(251,191,36,.18); border-color: rgba(251,191,36,.35); text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }

  .deal-body { padding-right: 72px; }
  .featured-row { margin-bottom: 12px; }
  .brand { font-size: clamp(32px, 9vw, 58px); line-height: .92; font-weight: 700; letter-spacing: -2px; max-width: 390px; text-wrap: balance; }
  .headline { margin-top: 14px; font-family: 'DM Serif Display', serif; font-size: clamp(34px, 10vw, 64px); line-height: .9; letter-spacing: -.8px; max-width: 390px; text-wrap: balance; }
  .desc { margin-top: 15px; color: var(--muted); font-size: 15px; line-height: 1.55; max-width: 360px; }
  .deal-tags { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .category-pill { color: white; background: rgba(255,255,255,.12); }
  .tiny-pill { color: rgba(255,255,255,.75); padding: 6px 10px; font-weight: 500; }

  .side-actions {
    position: absolute; z-index: 5; right: 14px; bottom: calc(var(--bottom-nav) + 92px);
    display: flex; flex-direction: column; gap: 18px; align-items: center;
  }
  .action { display: flex; flex-direction: column; align-items: center; gap: 5px; color: white; font-size: 11px; font-weight: 600; }
  .round-action {
    width: 52px; height: 52px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(0,0,0,.28); backdrop-filter: blur(12px); color: white; display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,.16);
  }
  .round-action:active { transform: scale(.94); }
  .round-action.saved { background: rgba(251,191,36,.22); color: #FFE5A3; border-color: rgba(251,191,36,.42); }
  .action-count { color: rgba(255,255,255,.84); text-shadow: 0 1px 8px rgba(0,0,0,.4); }

  .bottom-nav {
    position: fixed; z-index: 45; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); height: 58px;
    background: rgba(18,17,15,.76); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(18px);
    border-radius: 999px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 5px;
    max-width: 520px; margin: 0 auto;
  }
  .nav-item {
    border: 0; background: transparent; color: rgba(255,255,255,.58); border-radius: 999px; display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; cursor: pointer;
  }
  .nav-item.active { background: rgba(255,255,255,.12); color: white; }

  .sheet-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.38); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .bottom-sheet {
    position: fixed; z-index: 90; left: 0; right: 0; bottom: 0; transform: translateY(105%); transition: transform .26s cubic-bezier(.22,1,.36,1);
    background: #F7F4EE; color: #171411; border-radius: 28px 28px 0 0; padding: 10px 18px calc(24px + env(safe-area-inset-bottom)); max-height: 86dvh; overflow-y: auto;
  }
  .bottom-sheet.show { transform: translateY(0); }
  .handle { width: 44px; height: 5px; background: #D9D2C8; border-radius: 999px; margin: 0 auto 16px; }
  .sheet-title { font-size: 22px; font-weight: 700; letter-spacing: -.5px; margin-bottom: 4px; }
  .sheet-sub { color: #746D66; font-size: 13px; margin-bottom: 18px; }
  .sheet-section { margin: 18px 0; }
  .sheet-label { color: #8A837B; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 9px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter-chip {
    border: 1px solid #E2DDD5; background: white; color: #3C3834; border-radius: 999px; padding: 9px 13px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .filter-chip.active { background: #171411; color: white; border-color: #171411; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .primary, .secondary {
    flex: 1; border: none; border-radius: 16px; padding: 13px 16px; font-weight: 700; cursor: pointer;
  }
  .primary { background: #F97316; color: white; }
  .secondary { background: #EDE8E1; color: #181511; }

  .search-panel, .saved-panel, .all-panel, .add-panel {
    position: fixed; z-index: 78; inset: 0; background: #F7F4EE; color: #171411; transform: translateX(105%); transition: transform .24s ease;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom)); overflow-y: auto;
  }
  .search-panel.show, .saved-panel.show, .all-panel.show, .add-panel.show { transform: translateX(0); }
  .panel-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .panel-title { font-size: 24px; font-weight: 800; letter-spacing: -.6px; }
  .close-panel { border: none; background: #ECE6DE; width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; cursor: pointer; }
  .search-box { width: 100%; border: 1px solid #DDD6CC; background: white; border-radius: 18px; padding: 14px 16px; font-size: 16px; outline: none; margin-bottom: 18px; }
  .result-list { display: grid; gap: 10px; }
  .result-card {
    border: 1px solid #E4DED6; background: white; border-radius: 18px; padding: 14px; display: grid; gap: 7px; cursor: pointer;
  }
  .result-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .result-brand { font-weight: 800; font-size: 16px; }
  .result-mall { color: #7A7169; font-size: 12px; }
  .result-desc { color: #4B443E; font-size: 13px; line-height: 1.45; }
  .result-urg { color: #C2410C; font-size: 12px; font-weight: 800; white-space: nowrap; }

  .form-grid { display: grid; gap: 11px; }
  .form-grid input, .form-grid select, .form-grid textarea {
    width: 100%; border: 1px solid #DDD6CC; background: white; border-radius: 16px; padding: 13px 14px; font-size: 14px; outline: none;
  }
  .form-grid textarea { min-height: 88px; resize: vertical; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check-row { display: flex; align-items: center; gap: 9px; color: #5D554E; font-size: 14px; padding: 4px; }

  .empty-state { text-align: center; padding: 58px 18px; color: #766F68; }
  .empty-state strong { display: block; color: #171411; font-size: 18px; margin-bottom: 6px; }


  .all-toolbar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; }
  .all-toolbar::-webkit-scrollbar { height: 0; }
  .mini-chip { border: 1px solid #E2DDD5; background: white; color: #3C3834; border-radius: 999px; padding: 5px 14px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .mini-chip.active { background: #171411; color: white; border-color: #171411; }
  .all-chip { border: 1px solid #E2DDD5; background: white; color: #3C3834; border-radius: 999px; padding: 5px 14px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; font-family: 'DM Sans', sans-serif; flex-shrink: 0; transition: all .15s; }
  .all-chip.active { background: #F97316; color: white; border-color: #F97316; }
  .all-count { color: #746D66; font-size: 13px; margin: -6px 0 14px; }
  .expired-title { margin: 22px 0 10px; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #9A9288; }
  .expired-note { color:#8A837B; font-size:12px; margin:-4px 0 12px; line-height:1.45; }
  .all-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .all-card { position: relative; border: 1px solid #E4DED6; background: white; border-radius: 22px; padding: 16px; min-height: 168px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; box-shadow: 0 6px 20px rgba(23,20,17,.05); }
  .all-card.expired { opacity:.62; filter:saturate(.65); }
  .all-card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--card-accent, #F97316); }
  .all-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .all-brand { font-size: 20px; line-height: 1.05; font-weight: 800; letter-spacing: -.4px; }
  .all-mall { margin-top: 4px; color: #8A837B; font-size: 13px; }
  .all-urg { background: #FDECEA; color: #C0392B; border-radius: 999px; padding: 7px 10px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .all-urg.good { background: #E8F5E8; color: #2D6A2D; }
  .all-urg.expired { background:#ECE6DE; color:#766F68; }
  .all-desc { color: #5F5750; font-size: 15px; line-height: 1.45; margin-bottom: 14px; }
  .all-card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .all-cat { border-radius: 999px; padding: 7px 11px; font-size: 12px; font-weight: 800; background: #F4EFE8; color: #3C3834; }
  .all-actions { display: flex; gap: 7px; }
  .all-btn { border: 1px solid #E0D8CF; background: white; color: #625A52; border-radius: 12px; padding: 8px 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .all-btn.saved { color: #B45309; background: #FFF4DD; border-color: #F6D49B; }

  .fav-spotlight {
    margin: 14px 0 16px;
    border: 1px solid #F2D19B;
    background: linear-gradient(135deg, #FFF7E8, #FFFFFF);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 10px 28px rgba(180, 83, 9, .10);
  }
  .fav-kicker { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:#B45309; background:#FFF0D2; border-radius:999px; padding:7px 10px; margin-bottom:10px; }
  .fav-title { font-size:22px; line-height:1.05; font-weight:900; letter-spacing:-.5px; color:#171411; }
  .fav-meta { margin-top:5px; color:#7A7169; font-size:13px; }
  .fav-desc { margin-top:10px; color:#4B443E; font-size:14px; line-height:1.45; }
  .fav-footer { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:13px; }
  .fav-count { color:#B45309; font-size:13px; font-weight:900; }
  .fav-open { border:0; background:#171411; color:white; border-radius:999px; padding:9px 13px; font-size:12px; font-weight:800; cursor:pointer; }
  .favourite-ribbon { display:inline-flex; align-items:center; gap:6px; background:rgba(251,191,36,.26); border:1px solid rgba(251,191,36,.42); color:#FFE8B1; border-radius:999px; padding:7px 11px; font-size:10px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }

  @media (min-width: 760px) { .all-grid { grid-template-columns: 1fr; } }


  /* INLINE FILTER STRIP */
  .filter-strip {
    position: fixed; top: calc(56px + env(safe-area-inset-top)); left: 0; right: 0; z-index: 35;
    padding: 6px 14px 8px;
    display: flex; flex-direction: column; gap: 5px;
    background: linear-gradient(to bottom, rgba(11,10,9,.95) 70%, transparent);
    pointer-events: none;
  }
  .filter-strip-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; pointer-events: auto; padding-bottom: 2px; }
  .filter-strip-row::-webkit-scrollbar { height: 0; }
  .fs-chip {
    flex-shrink: 0; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.1);
    color: rgba(255,255,255,.8); border-radius: 999px; padding: 6px 14px;
    font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
    font-family: 'DM Sans', sans-serif; transition: all .15s;
  }
  .fs-chip:active { transform: scale(.96); }
  .fs-chip.active { background: #F97316; border-color: #F97316; color: white; }

  /* CURATOR */
  .curator-overlay {
    position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.65); backdrop-filter: blur(8px);
    display: none; place-items: center;
  }
  .curator-overlay.show { display: grid; }
  .curator-box {
    background: #F7F4EE; color: #171411; border-radius: 28px; padding: 28px 24px;
    width: min(340px, 90vw); display: flex; flex-direction: column; gap: 14px;
  }
  .curator-box h3 { font-size: 20px; font-weight: 800; letter-spacing: -.4px; }
  .curator-box p { font-size: 13px; color: #746D66; line-height: 1.5; }
  .curator-box input { width: 100%; border: 1.5px solid #DDD6CC; background: white; border-radius: 14px; padding: 12px 14px; font-size: 15px; outline: none; font-family: 'DM Sans', sans-serif; }
  .curator-box input:focus { border-color: #F97316; }
  .curator-btns { display: flex; gap: 10px; }
  .curator-btns button { flex: 1; border: none; border-radius: 14px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .c-primary { background: #F97316; color: white; }
  .c-secondary { background: #ECE8E1; color: #171411; }

  /* STORE LOCATION */
  .store-loc-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px; padding: 6px 11px; margin-bottom: 10px;
    font-size: 12px; font-weight: 700; color: rgba(255,255,255,.92);
    backdrop-filter: blur(8px);
  }
  .all-store-loc { font-size: 12px; color: #C2410C; font-weight: 700; margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  .result-store-loc { font-size: 11px; color: #C2410C; font-weight: 700; margin-top: 2px; display: flex; align-items: center; gap: 4px; }

  .pulse-card {
    position: relative; z-index: 2; width:min(100%,520px); min-height:100%; padding: calc(95px + env(safe-area-inset-top)) 18px calc(var(--bottom-nav) + 28px);
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .ada-mark {
    width: 76px; height: 76px; border-radius: 24px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #F97316, #FBBF24);
    color: #171411; font-weight: 900; font-size: 32px; letter-spacing: -1.6px;
    box-shadow: 0 24px 60px rgba(249,115,22,.30);
    margin-bottom: 18px;
  }
  .pulse-kicker { display:inline-flex; width:max-content; align-items:center; gap:7px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.16); font-size:12px; font-weight:800; color:#FFE8B1; text-transform:uppercase; letter-spacing:.08em; margin-bottom:14px; }
  .pulse-title { font-size: clamp(42px, 11vw, 72px); line-height:.88; font-weight:900; letter-spacing:-2.4px; max-width:420px; }
  .pulse-title .highlight-word { color:#FBBF24; font-family:'DM Serif Display', serif; font-weight:400; font-style:italic; letter-spacing:-1px; }
  .pulse-sub { margin-top:14px; color:var(--muted); font-size:16px; line-height:1.45; max-width:380px; }
  .ada-line { margin-top: 13px; display:flex; flex-wrap:wrap; gap:8px; }
  .ada-line span {
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.10);
    border-radius:999px; padding:7px 10px; color:rgba(255,255,255,.78);
    font-size:12px; font-weight:800;
  }

  .pulse-card {
    position: relative; z-index: 2; width: min(100%, 520px); height: 100%; padding: 98px 18px calc(var(--bottom-nav) + 28px);
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .pulse-kicker { display:inline-flex; width:max-content; align-items:center; gap:7px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.16); font-size:12px; font-weight:800; color:#FFE8B1; text-transform:uppercase; letter-spacing:.08em; margin-bottom:14px; }
  .pulse-title { font-size: clamp(38px, 10vw, 66px); line-height:.92; font-weight:800; letter-spacing:-2px; max-width:390px; }

<div class="app-shell">

function esc(s='') { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function endOfDealDay(d) { const end = new Date(d); end.setHours(23,59,59,999); return end; }
function isActiveDeal(d) {
  const now = new Date();
  // Use local date string comparison to avoid UTC timezone mismatch
  const todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  const startStr = d.startDate || '2000-01-01';
  const endStr = d.endDate || '9999-12-31'; // null = ongoing
  return startStr <= todayStr && endStr >= todayStr;
}
function isExpiredDeal(d) { return !isActiveDeal(d); }
function daysLeft(d) {
  const now = new Date();
  const end = endOfDealDay(d);
  return Math.max(0, Math.ceil((end - now) / 86400000));
}
function urgency(days, expired=false) {
  if (expired) return "Expired";
  if (!isFinite(days)) return "Ongoing";
  if (days <= 1) return "Ends today";
  if (days <= 3) return `${days} days left`;
  return `${days}d left`;
}
function fmtDate(d) { return new Date(d).toLocaleDateString("en-MY", { day:"numeric", month:"short" }); }
function baseDeals() {
  return deals

    .filter(d => cat === "All" || d.category === cat);
}
function favouriteDeals(limit=5) {
  return baseDeals()
    .slice()
    .sort((a,b) => ((b.saves || 0) + (b.shares || 0) * 0.35) - ((a.saves || 0) + (a.shares || 0) * 0.35))
    .slice(0, limit);
}
function currentFavourite() {
  return favouriteDeals(1)[0];
}
function isFavouriteDeal(d) {
  const fav = currentFavourite();
  return fav && fav.id === d.id;
}
function displaySaves(d) {

}
function filteredDeals() {
  const todayStr = new Date().toISOString().split('T')[0];
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
  const weekStr = weekAgo.toISOString().split('T')[0];
  let items = deals.filter(d => isActiveDeal(d) && d.city === city);
  if (quickFilter === 'ending-today') items = items.filter(d => d.endDate === todayStr);
  else if (quickFilter === 'top-picks') items = items.filter(d => d.featured || isFavouriteDeal(d));
  else if (quickFilter === 'new-week') items = items.filter(d => d.startDate && d.startDate >= weekStr);
  else if (quickFilter && quickFilter !== 'All') items = items.filter(d => d.category === quickFilter);
  // One primary deal per brand in default view
  if (!quickFilter || quickFilter === 'All') {
    const seen = new Set();
    items = items.filter(d => { if (seen.has(d.brand)) return false; seen.add(d.brand); return true; });
  }
  return items.sort((a,b) => new Date(a.endDate) - new Date(b.endDate));
}

function recentlyExpiredDeals() {
  const now = new Date();
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
  return deals
    .filter(d => d.brand && d.endDate && isExpiredDeal(d))
    .filter(d => d.city === city)
    .filter(d => mall === "All Malls" || d.mall === mall)
    .filter(d => cat === "All" || d.category === cat)
    .filter(d => endOfDealDay(d.endDate) >= cutoff && endOfDealDay(d.endDate) < now)
    .sort((a,b) => endOfDealDay(b.endDate) - endOfDealDay(a.endDate))
    .slice(0, 6);
}

function allDealCard(d, expired=false) {

  const colors = palette[d.category] || ['#F97316', '#FBBF24'];
  const deleteBtn = curatorUnlocked
    ? `<button class="all-btn" style="color:#C0392B;border-color:#FDECEA;background:#FDECEA;" onclick="event.stopPropagation();deleteDeal('${esc(d.id)}','${esc(d.brand)}')">✕ Remove</button>`
    : '';
  return `<article class="all-card ${expired ? 'expired' : ''}" style="--card-accent:${colors[0]}" onclick="event.target.closest('button') || (expired ? showToast('This deal has expired') : jumpToDeal('${esc(d.id)}'))">

      <div class="all-card-top">
        <div><div class="all-brand">${esc(d.brand)}</div><div class="all-mall">${esc(d.mall)} · ${esc(d.city)}</div>${d.storeLocation ? `<div class="all-store-loc">📍 ${esc(d.storeLocation)}</div>` : ''}</div>

      </div>

    </div>

        <button class="all-btn ${saved ? 'saved' : ''}" onclick="event.stopPropagation();toggleSave('${esc(d.id)}')">${saved ? icons.bookmarkFill.replaceAll('24','17') : icons.bookmark.replaceAll('24','17')} ${saved ? 'Saved' : 'Save'}</button>

async function deleteDeal(id, brand) {
  if (!confirm('Remove "' + brand + '" from the feed?')) return;
  showToast('Removing…');
  try {
    await callManageFn('delete', { id });
    deals = deals.filter(d => d.id !== id);
    savedIds = savedIds.filter(s => s !== id);
    save(); renderFeed(); renderAllDeals();
    showToast(brand + ' removed');
  } catch { showToast('Error removing — try again'); }
}

function renderSearch() {

  document.getElementById('searchResults').innerHTML = results.length ? results.map(resultCard).join('') : `<div class="empty-state"><strong>No deals found</strong>Try another brand, mall, or category.</div>`;

function jumpToDeal(id) {
  closePanels();
  const target = deals.find(d => d.id === id);
  if(target) {
    city = target.city; mall = "All Malls"; cat = "All"; quickFilter = "All"; renderFeed();
    setTimeout(()=>document.getElementById(`deal-${CSS.escape(id)}`)?.scrollIntoView({behavior:'smooth'}), 80);
    if(typeof umami !== 'undefined') umami.track('deal-view', { deal: target.brand, headline: target.headline || '', mall: target.mall, category: target.category });
  }

async function toggleSave(id) {
  const has = savedIds.includes(id);
  savedIds = has ? savedIds.filter(x => x !== id) : [...savedIds, id];
  deals = deals.map(d => d.id === id ? {...d, saves: Math.max(0, (d.saves || 0) + (has ? -1 : 1))} : d);
  save(); renderFeed(); renderSaved(); renderAllDeals();
  showToast(has ? 'Removed from saved' : 'Saved. Nice one.');
  const deal = deals.find(d => d.id === id);
  if (!has && deal && typeof umami !== 'undefined') umami.track('deal-save', { deal: deal.brand, mall: deal.mall, category: deal.category });
  // Update save count in Supabase silently via the validated RPC
  if (deal) {
    fetch(`${SB_URL}/rest/v1/rpc/increment_deal_save`, {
      method: 'POST', headers: SB_HEADERS, body: JSON.stringify({ p_deal_id: String(id), p_delta: has ? -1 : 1 })
    }).catch(() => {});
  }
}
let activeShareDeal = null;
function shareDeal(id) {

function closeShareSheet() {

}
function shareVia(platform) {
  const d = activeShareDeal;
  if (!d) return;
  const siteUrl = window.location.href.split('?')[0];
  const text = `${d.brand} @ ${d.mall}, ${d.city}\n\n${d.headline || 'Deal alert'}\n${d.description}${d.storeLocation ? '\n📍 ' + d.storeLocation : ''}\n\n${d.endDate ? 'Ends ' + fmtDate(d.endDate) + '\n' : ''}\nFind more deals on AdaDeals 👉 ${siteUrl}`;
  const encodedText = encodeURIComponent(text);
  const encodedUrl = encodeURIComponent(siteUrl);

  if (platform === 'whatsapp') {
    if(typeof umami !== 'undefined') umami.track('deal-share', { platform: 'whatsapp', deal: d.brand, mall: d.mall });
    window.open(`https://wa.me/?text=${encodedText}`, '_blank');
    closeShareSheet();
  } else if (platform === 'facebook') {
    if(typeof umami !== 'undefined') umami.track('deal-share', { platform: 'facebook', deal: d.brand, mall: d.mall });
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}&quote=${encodeURIComponent(d.brand + ' — ' + (d.headline || 'Deal alert') + '. Find it on AdaDeals.')}`, '_blank');
    closeShareSheet();
  } else if (platform === 'instagram') {
    if(typeof umami !== 'undefined') umami.track('deal-share', { platform: 'instagram', deal: d.brand, mall: d.mall });
    navigator.clipboard.writeText(text).then(() => {
      closeShareSheet();
      showToast('Copied! Open Instagram and paste into your story or post 📸');
    }).catch(() => showToast('Copy manually then paste to Instagram'));
  } else if (platform === 'copy') {
    if(typeof umami !== 'undefined') umami.track('deal-share', { platform: 'copy', deal: d.brand, mall: d.mall });
    navigator.clipboard.writeText(text).then(() => {
      closeShareSheet();
      showToast('Copied to clipboard 📋');
    }).catch(() => showToast('Could not copy — try manually'));
  }
}

async function submitDeal() {
  const brand = document.getElementById('fBrand').value.trim();
  const headline = document.getElementById('fHeadline').value.trim();
  const description = document.getElementById('fDesc').value.trim();
  const endDate = document.getElementById('fDate').value;
  const dcity = document.getElementById('fCity').value;
  const dmall = document.getElementById('fMall').value;
  const dcat = document.getElementById('fCat').value;
  const startDate = document.getElementById('fStartDate').value || new Date().toISOString().split('T')[0];
  const storeLocation = document.getElementById('fStoreLoc')?.value.trim() || '';
  const featured = document.getElementById('fFeatured').checked;
  if (!brand || !description || !endDate) { showToast('Fill in brand, description and end date'); return; }
  if (endDate < startDate) { showToast('End date must be after start date'); return; }
  showToast(editingId ? 'Saving changes…' : 'Adding deal…');
  try {
    if (editingId) {
      // EDIT mode
      await callManageFn('edit', { id: editingId, fields: { brand, city: dcity, mall: dmall, category: dcat, headline: headline || 'Deal alert', description, store_location: storeLocation, start_date: startDate, end_date: endDate, featured,
        is_secret: document.getElementById('fIsSecret').checked,
        unlock_threshold: parseInt(document.getElementById('fThreshold')?.value || 50),
        unlock_message: document.getElementById('fUnlockMsg')?.value.trim() || '',
        tc_text: document.getElementById('fTc')?.value.trim() || '',
        max_claims: parseInt(document.getElementById('fMaxClaims')?.value || 30) } });
      const refreshRes = await fetch(`${SB_URL}/rest/v1/deals?select=*&order=created_at.desc`, { headers: SB_HEADERS });
      const refreshData = await refreshRes.json();
      deals = refreshData && refreshData.length ? refreshData.map(mapRow) : deals;
      city = dcity; mall = "All Malls"; cat = "All";
      cancelEdit();
      ['fBrand','fHeadline','fDesc','fStartDate','fDate','fStoreLoc','fUnlockMsg','fTc'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
      document.getElementById('fFeatured').checked = false;
      renderFeed(); openManage(); showToast('Changes saved ✓');
      return;
    }
    // ADD mode — If featured, unfeature others in same city first
    if (featured) {
      await callManageFn('unfeature-city', { city: dcity });
    }
    await callManageFn('add', { brand, city: dcity, mall: dmall, category: dcat, headline: headline || 'Deal alert', description, store_location: storeLocation, start_date: startDate, end_date: endDate, featured, saves: 0, shares: 0,
      is_secret: document.getElementById('fIsSecret').checked,
      unlock_threshold: parseInt(document.getElementById('fThreshold')?.value || 50),
      unlock_message: document.getElementById('fUnlockMsg')?.value.trim() || '',
      tc_text: document.getElementById('fTc')?.value.trim() || '',
      max_claims: parseInt(document.getElementById('fMaxClaims')?.value || 30),
      claims_count: 0 });
    // Re-fetch all deals fresh from Supabase so nothing gets filtered incorrectly
    const refreshRes = await fetch(`${SB_URL}/rest/v1/deals?select=*&order=created_at.desc`, { headers: SB_HEADERS });
    const refreshData = await refreshRes.json();
    deals = refreshData && refreshData.length ? refreshData.map(mapRow) : deals;
    city = dcity; mall = "All Malls"; cat = "All";
    renderFeed(); closePanels(); showToast('Deal live 🎉');
    ['fBrand','fHeadline','fDesc','fStartDate','fDate','fStoreLoc','fUnlockMsg','fTc'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; }); document.getElementById('fFeatured').checked = false; document.getElementById('fIsSecret').checked = false; toggleSecretFields();
  } catch(e) {
    console.error('Submit error:', e);
    showToast('Error: ' + (e.message || 'check console'));
  }
}

let activeClaim = null;
async function claimDeal(id) {
  const d = deals.find(x => x.id === id);
  if (!d) return;
  if (d.claimsCount >= d.maxClaims) { showToast('All claims have been taken!'); return; }
  activeClaim = d;
  document.getElementById('cmIcon').textContent = '🎉';
  document.getElementById('cmBrand').textContent = d.brand + ' @ ' + d.mall;
  document.getElementById('cmMsg').textContent = d.unlockMessage || 'You unlocked a secret deal!';
  document.getElementById('cmTc').textContent = d.tcText || 'Show this screen to staff to claim.';
  document.getElementById('cmClaims').textContent = (d.maxClaims - d.claimsCount) + ' of ' + d.maxClaims + ' claims remaining';
  document.getElementById('claimModal').classList.add('show');
}
async function confirmShow() {
  if (!activeClaim) return;
  document.getElementById('cmIcon').textContent = '✅';
  document.getElementById('cmShow' + 'Btn') && (document.querySelector('.cm-show-btn').textContent = 'Claimed!');
  if(typeof umami !== 'undefined') umami.track('secret-promo-claimed', { deal: activeClaim.brand, mall: activeClaim.mall });
  try {
    const res = await fetch(`${SB_URL}/rest/v1/rpc/claim_deal`, {
      method: 'POST', headers: SB_HEADERS, body: JSON.stringify({ p_deal_id: String(activeClaim.id) })
    });
    if (!res.ok) throw new Error(await res.text());
    const rows = await res.json();
    const newCount = rows?.[0]?.new_claims_count ?? ((activeClaim.claimsCount || 0) + 1);
    deals = deals.map(d => d.id === activeClaim.id ? {...d, claimsCount: newCount} : d);
    renderFeed(); renderAllDeals();
    showToast('Claimed! Show this screen to staff 🎉');
  } catch {
    showToast('Could not claim — it may already be fully claimed');
  }
}

// MANAGE PANEL
function openManage() {
  if (!curatorUnlocked) { openCurator(); return; }
  closePanels();
  document.getElementById('managePanel').classList.add('show');
  renderManage();
}

function renderManage() {
  const todayStr = new Date().toISOString().split('T')[0];
  const scheduled = deals.filter(d => d.startDate && d.startDate > todayStr).sort((a,b) => a.startDate.localeCompare(b.startDate));
  const live = deals.filter(d => isActiveDeal(d)).sort((a,b) => new Date(a.endDate) - new Date(b.endDate));

  let html = '';

  html += `<div class="manage-section">
    <div class="manage-section-title">📅 Scheduled <span>${scheduled.length}</span></div>`;
  if (!scheduled.length) {
    html += `<div class="manage-empty">No scheduled deals yet.<br>Set a future start date when adding a deal.</div>`;
  } else {
    html += scheduled.map(d => manageCard(d, 'scheduled')).join('');
  }
  html += `</div>`;

  html += `<div class="manage-section" style="margin-top:20px;">
    <div class="manage-section-title">🟢 Live now <span>${live.length}</span></div>`;
  if (!live.length) {
    html += `<div class="manage-empty">No live deals right now.</div>`;
  } else {
    html += live.map(d => manageCard(d, 'live')).join('');
  }
  html += `</div>`;

  document.getElementById('manageContent').innerHTML = html;
}

function manageCard(d, type) {
  const badge = type === 'scheduled'
    ? `<span class="scheduled-badge">Goes live ${fmtDate(d.startDate)}</span>`
    : `<span class="live-badge">Live${d.endDate ? ' · ends ' + fmtDate(d.endDate) : ''}</span>`;
  return `<div class="manage-card">
    <div class="manage-card-top">
      <div>
        <div class="manage-brand">${esc(d.brand)}</div>
        <div class="manage-meta">${esc(d.mall)} · ${esc(d.city)} · ${esc(d.category)}</div>
        <div class="manage-dates">${esc(d.startDate || '—')} → ${d.endDate ? esc(d.endDate) : 'No end date'}${badge}</div>
        <div style="font-size:13px;color:#6B6560;line-height:1.4;">${esc(d.headline || '')}${d.headline && d.description ? ' — ' : ''}${esc(d.description || '')}</div>
      </div>
    </div>
    <div class="manage-actions" style="margin-top:12px;">
      <button class="manage-btn edit" onclick="editDeal('${esc(d.id)}')">✏️ Edit</button>
      <button class="manage-btn del" onclick="deleteDeal('${esc(d.id)}','${esc(d.brand)}')">✕ Remove</button>
    </div>
  </div>`;
}

let editingId = null;
function editDeal(id) {
  const d = deals.find(x => x.id === id);
  if (!d) return;
  editingId = id;

  // Pre-fill form with deal data
  document.getElementById('fBrand').value = d.brand || '';
  document.getElementById('fHeadline').value = d.headline || '';
  document.getElementById('fDesc').value = d.description || '';
  document.getElementById('fStartDate').value = d.startDate || '';
  document.getElementById('fDate').value = d.endDate || '';
  document.getElementById('fStoreLoc').value = d.storeLocation || '';
  document.getElementById('fFeatured').checked = d.featured || false;

  // Set city first, then update malls, then set mall
  setupForm();
  document.getElementById('fCity').value = d.city || 'Kuching';
  updateFormMalls();
  setTimeout(() => { document.getElementById('fMall').value = d.mall || ''; }, 50);
  document.getElementById('fCat').value = d.category || 'Fashion';

  // Show editing state
  document.getElementById('addPanelTitle').textContent = 'Edit promotion';
  document.getElementById('editingBadge').classList.add('show');
  document.getElementById('submitBtn').textContent = 'Save changes';

  closePanels();
  document.getElementById('addPanel').classList.add('show');
}

function cancelEdit() {
  editingId = null;
  const t = document.getElementById('addPanelTitle'); if(t) t.textContent = 'Add promotion';
  const b = document.getElementById('editingBadge'); if(b) b.classList.remove('show');
  const s = document.getElementById('submitBtn'); if(s) s.textContent = 'Add to feed';
}

async function init() { await load(); setupForm(); renderFeed(); }
init();

function renderFilterStrip() {
  const strip = document.getElementById('filterStrip');
  if (!strip) return;
  strip.innerHTML = `<div class="filter-strip-row">${quickFiltersHtml('dark')}</div>`;
}
</script>
</body>
</html>
